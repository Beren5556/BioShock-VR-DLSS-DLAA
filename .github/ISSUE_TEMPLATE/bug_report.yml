name: Informe de fallo
description: Comunicar un problema reproducible de la beta privada
title: "[Fallo] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: BioShock 2 DLSS/DLAA. No adjuntes Bioshock2HD.exe, archivos del juego, credenciales ni volcados sin revisar.
  - type: input
    id: version
    attributes:
      label: Versión y SHA-256
      placeholder: BS2 v0.1.0-beta · SHA-256 del instalador
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Windows, GPU, controlador, visor y runtime VR.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado real
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Extractos de registro revisados
      description: Retira nombres de usuario, rutas personales y cualquier dato sensible.
