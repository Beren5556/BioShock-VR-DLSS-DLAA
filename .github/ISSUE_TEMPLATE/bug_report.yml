name: Bug report
description: Report a reproducible problem with the BioShock 1–2 VR DLSS/DLAA fork
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please identify the game. Do not attach game executables, assets, credentials or unreviewed memory dumps.
  - type: input
    id: version
    attributes:
      label: Version, game and SHA-256
      placeholder: 0.2.17 English, BioShock 2 Remastered, installer SHA-256
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows, GPU, driver, headset and VR runtime.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Reviewed log excerpts
      description: Remove usernames, personal paths and any sensitive information.
