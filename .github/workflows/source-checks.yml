name: Source checks

on:
  push:
    branches: [main, codex/english-v0.2.17]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-and-launcher:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify repository and launcher
        shell: pwsh
        run: .\scripts\Verify-Repository.ps1 -BuildLauncher

      - name: Verify text-only runtime changes against the Spanish release
        shell: pwsh
        run: node scripts/localization/english.mjs verify
