name: Source checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-and-launcher:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify repository and launcher
        shell: powershell
        run: .\scripts\Verify-Repository.ps1 -BuildLauncher
