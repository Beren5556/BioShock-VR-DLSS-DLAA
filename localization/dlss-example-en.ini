; Experimental DLSS 4.5 for BioShock Remastered VR.
; The launcher manages this file in %LOCALAPPDATA%\BioshockVR\dlss.ini.
; "off" keeps DLSS disabled. It does not enable spatial upscaling.
; runtime identifies the tested base; the installer includes nvngx_dlss.dll 310.7.0.0.
; A different x64 DLL is allowed with a warning, at the user's own risk.
[dlss]
mode=off
runtime=310.7.0
preset=auto
quality=auto
outputWidth=4056
outputHeight=4056
; SR quality preference, also retained in NORMAL and DLAA.
; Effective SR render size: output * numerator/denominator, rounded to an even size.
srScaleNumerator=2
srScaleDenominator=3
; Optional sharpening after DLSS, only in sr mode. 0 preserves the previous image.
; Shared preference between launcher and F1/F2/F3; inactive in NORMAL/DLAA.
sharpnessPercent=0

; Advanced setting for reconstructing camera movement from depth.
; Version 0.2 confirmed normal finite D3D depth; the actual near plane is 10 uu.
; Do not change unless specifically calibrating the game's projection.
nearPlaneUu=10.0
